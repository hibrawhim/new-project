name: Build signed APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Fallback keystore, kept in the Actions cache so successive builds share
      # one signing key (needed to install updates over an older APK).
      - name: Restore fallback keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.mail2telegram-keystore
          key: mail2telegram-release-keystore-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - using a cached auto-generated keystore. See README to set your own."
            mkdir -p ~/.mail2telegram-keystore
            KS=~/.mail2telegram-keystore/release.jks
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
                -alias mail2telegram -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass mail2telegram -keypass mail2telegram \
                -dname "CN=Mail2Telegram, O=Mail2Telegram, C=US"
            fi
            echo "SIGNING_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=mail2telegram" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=mail2telegram" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=mail2telegram" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          mv "$APK" "app/build/outputs/apk/release/Mail2Telegram-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mail2Telegram-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/Mail2Telegram-*.apk
          if-no-files-found: error
